<!--
  ده مش ملف بيتقرأ في المشروع — ده الكود اللي هتلزقه جوه EmailJS نفسه:
  Email Templates → Template بتاعك → Edit Content → Code Editor.
  فيه شرح كامل لباقي الخطوات في الشات.
-->
<div style="background-color:#080B14; padding:40px 16px; font-family: Inter, Arial, sans-serif;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:560px; margin:0 auto;">
    <tr>
      <td style="background: linear-gradient(90deg,#8B5CF6,#06B6D4); height:4px; border-radius:4px;"></td>
    </tr>
    <tr>
      <td style="background-color:#0D1117; border:1px solid rgba(255,255,255,0.08); border-top:none; border-radius:0 0 16px 16px; padding:36px 32px;">

        <!-- Header -->
        <table role="presentation" width="100%" cellpadding="0" cellspacing="0">
          <tr>
            <td>
              <span style="display:inline-block; width:36px; height:36px; border-radius:10px; background:linear-gradient(135deg,#8B5CF6,#06B6D4); text-align:center; line-height:36px; font-weight:800; color:#fff; font-size:15px;">ME</span>
            </td>
            <td style="padding-right:12px;"></td>
            <td>
              <span style="color:#F1F5F9; font-weight:700; font-size:16px;">Portfolio Contact Form</span>
            </td>
          </tr>
        </table>

        <h1 style="color:#F1F5F9; font-size:22px; font-weight:800; margin:28px 0 4px;">
          New message from {{from_name}}
        </h1>
        <p style="color:#94A3B8; font-size:14px; margin:0 0 28px;">
          Someone reached out through your portfolio's contact form.
        </p>

        <!-- Info rows -->
        <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="margin-bottom:24px;">
          <tr>
            <td style="padding:10px 0; border-bottom:1px solid rgba(255,255,255,0.08);">
              <span style="display:block; color:#475569; font-size:11px; text-transform:uppercase; letter-spacing:0.08em; margin-bottom:4px;">From</span>
              <span style="color:#F1F5F9; font-size:15px; font-weight:600;">{{from_name}}</span>
            </td>
          </tr>
          <tr>
            <td style="padding:10px 0; border-bottom:1px solid rgba(255,255,255,0.08);">
              <span style="display:block; color:#475569; font-size:11px; text-transform:uppercase; letter-spacing:0.08em; margin-bottom:4px;">Email</span>
              <a href="mailto:{{from_email}}" style="color:#A78BFA; font-size:15px; font-weight:600; text-decoration:none;">{{from_email}}</a>
            </td>
          </tr>
          <tr>
            <td style="padding:10px 0;">
              <span style="display:block; color:#475569; font-size:11px; text-transform:uppercase; letter-spacing:0.08em; margin-bottom:4px;">Subject</span>
              <span style="color:#F1F5F9; font-size:15px; font-weight:600;">{{subject}}</span>
            </td>
          </tr>
        </table>

        <!-- Message -->
        <div style="background:rgba(255,255,255,0.04); border:1px solid rgba(255,255,255,0.08); border-radius:14px; padding:20px;">
          <span style="display:block; color:#475569; font-size:11px; text-transform:uppercase; letter-spacing:0.08em; margin-bottom:10px;">Message</span>
          <p style="color:#CBD5E1; font-size:15px; line-height:1.7; margin:0; white-space:pre-wrap;">{{message}}</p>
        </div>

        <!-- CTA -->
        <table role="presentation" cellpadding="0" cellspacing="0" style="margin-top:28px;">
          <tr>
            <td style="border-radius:9999px; background:linear-gradient(90deg,#8B5CF6,#7c4ded);">
              <a href="mailto:{{from_email}}" style="display:inline-block; padding:12px 24px; color:#fff; font-weight:700; font-size:14px; text-decoration:none;">
                Reply to {{from_name}} →
              </a>
            </td>
          </tr>
        </table>

        <p style="color:#475569; font-size:12px; margin-top:32px;">
          Sent automatically from your portfolio's contact form.
        </p>
      </td>
    </tr>
  </table>
</div>
